<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Signaux Lucky Jet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #f39c12; font-size: 22px; margin-bottom: 20px; text-align: center; text-transform: uppercase; }
        label { font-size: 14px; color: #8b949e; display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 15px; margin-bottom: 15px; outline: none; }
        input[type="text"]:focus { border-color: #f39c12; }
        .signal-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(45deg, #f39c12, #e67e22); border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .btn-add { background: #238636; margin-top: 0; padding: 10px; margin-bottom: 15px; }
        .alert { padding: 12px; border-radius: 8px; font-size: 14px; margin-top: 15px; display: none; text-align: center; }
        .alert-success { background: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; color: #2ecc71; }
        .alert-error { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; color: #e74c3c; }
    </style>
</head>
<body>

<div class="card">
    <h1>⚙️ Panneau Admin VIP</h1>

    <label for="session-title">Nom de la Session</label>
    <input type="text" id="session-title" placeholder="Ex: SESSION MATIN (10H - 12H)">

    <label>Signaux de la Session</label>
    <div id="signals-container">
        <div class="signal-row">
            <input type="text" placeholder="Heure (ex: 10:15)" class="sig-time">
            <input type="text" placeholder="Cote (ex: 2.10)" class="sig-odd">
            <input type="text" placeholder="Securité (ex: 1.50)" class="sig-safe">
        </div>
    </div>

    <button class="btn btn-add" onclick="addSignalRow()">+ Ajouter un signal</button>
    <button class="btn" onclick="publishSignals()">🚀 PUBLIER LES SIGNAUX WEB</button>

    <div id="status-msg" class="alert"></div>
</div>

<script>
    const WORKER_URL = "https://zikooneverification.lucsckoba.workers.dev";

    function addSignalRow() {
        const container = document.getElementById('signals-container');
        const div = document.createElement('div');
        div.className = 'signal-row';
        div.innerHTML = `
            <input type="text" placeholder="Heure (ex: 10:15)" class="sig-time">
            <input type="text" placeholder="Cote (ex: 2.10)" class="sig-odd">
            <input type="text" placeholder="Securité (ex: 1.50)" class="sig-safe">
        `;
        container.appendChild(div);
    }

    async function publishSignals() {
        const sessionName = document.getElementById('session-title').value.trim() || "SESSION ACTIVE";
        const times = document.querySelectorAll('.sig-time');
        const odds = document.querySelectorAll('.sig-odd');
        const safes = document.querySelectorAll('.sig-safe');

        const signals = [];
        for (let i = 0; i < times.length; i++) {
            const time = times[i].value.trim();
            const odd = odds[i].value.trim();
            const safe = safes[i].value.trim() || "1.50";

            if (time && odd) {
                signals.push({ time, multiplier: odd, safety: safe });
            }
        }

        const msgBox = document.getElementById('status-msg');
        msgBox.style.display = 'none';

        try {
            const res = await fetch(`${WORKER_URL}/set-signals`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sessionName, signals })
            });

            const data = await res.json();
            if (data.success) {
                msgBox.className = "alert alert-success";
                msgBox.innerText = "✅ Session publiée avec succès sur le site web !";
            } else {
                msgBox.className = "alert alert-error";
                msgBox.innerText = "❌ Erreur : " + data.error;
            }
        } catch (e) {
            msgBox.className = "alert alert-error";
            msgBox.innerText = "❌ Impossible de contacter le serveur Worker.";
        }
        msgBox.style.display = 'block';
    }
</script>

</body>
</html>
