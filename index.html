<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Jet VIP - Signaux Global</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 25px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #f39c12; font-size: 22px; margin-bottom: 8px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p.subtitle { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
        
        .login-box, .signals-box { display: block; }
        .hidden { display: none !important; }

        input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 16px; text-align: center; margin-bottom: 15px; outline: none; }
        input[type="text"]:focus { border-color: #f39c12; }

        .btn { width: 100%; padding: 14px; background: linear-gradient(45deg, #f39c12, #e67e22); border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; opacity: 0.5; }

        .alert { padding: 12px; border-radius: 8px; font-size: 14px; margin-top: 15px; text-align: center; }
        .alert-error { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; color: #e74c3c; }
        .alert-success { background: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; color: #2ecc71; }

        .session-badge { background: #21262d; border: 1px solid #30363d; border-radius: 20px; padding: 6px 16px; display: inline-block; color: #f39c12; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        .signal-display { background: #0d1117; border: 2px dashed #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .sig-time { font-size: 18px; color: #8b949e; margin-bottom: 5px; }
        .sig-odd { font-size: 36px; font-weight: bold; color: #2ecc71; margin: 10px 0; }
        .sig-safe { font-size: 14px; color: #e74c3c; font-weight: bold; }
        .logout-link { color: #8b949e; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 LUCKY JET VIP</h1>
    <p class="subtitle">Accès exclusif aux signaux VIP</p>

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login-screen" class="login-box">
        <input type="text" id="user-id" placeholder="Ex: 363430216">
        <button class="btn" onclick="verifyAccess()">VÉRIFIER MON ACCÈS</button>
        <div id="login-msg" class="alert hidden"></div>
    </div>

    <!-- ÉCRAN DES SIGNAUX -->
    <div id="signal-screen" class="signals-box hidden">
        <div id="session-title" class="session-badge">SESSION EN COURS</div>
        
        <div class="signal-display">
            <div id="signal-time" class="sig-time">Heure: --:--</div>
            <div id="signal-odd" class="sig-odd">x0.00</div>
            <div id="signal-safe" class="sig-safe">Sécurité: x1.50</div>
        </div>

        <button id="next-btn" class="btn" onclick="nextSignal()">PROCHAIN SIGNAL</button>
        <div>
            <span class="logout-link" onclick="logout()">Changer d'ID 1win</span>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://zikooneverification.lucsckoba.workers.dev";
    let activeSignals = [];
    let currentIndex = 0;
    let autoCheckTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedId = localStorage.getItem('luckyjet_vip_id');
        if (savedId) {
            document.getElementById('user-id').value = savedId;
            verifyAccess(true);
        }
    });

    async function verifyAccess(isAuto = false) {
        const userId = document.getElementById('user-id').value.trim();

        if (!userId) {
            showMsg("Veuillez entrer votre ID 1win", "error");
            return;
        }

        try {
            const res = await fetch(`${WORKER_URL}/get-signals?id=${userId}`);
            const data = await res.json();

            if (data.error) {
                showMsg("❌ " + data.error, "error");
                localStorage.removeItem('luckyjet_vip_id');
            } else {
                localStorage.setItem('luckyjet_vip_id', userId);
                if (!isAuto) showMsg("✅ Accès VIP Confirmé !", "success");
                
                activeSignals = data.signals || [];
                currentIndex = 0;
                
                let cleanSessionName = (data.sessionName || "SESSION ACTIVE").replace(/^Ex:\s*/i, '');
                document.getElementById('session-title').innerText = cleanSessionName;

                setTimeout(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('signal-screen').classList.remove('hidden');
                    updateSignalDisplay();

                    if (!autoCheckTimer) {
                        autoCheckTimer = setInterval(updateButtonStatus, 2000);
                    }
                }, isAuto ? 0 : 800);
            }
        } catch (e) {
            showMsg("❌ Connexion au serveur impossible", "error");
        }
    }

    // Récupère la minute du signal
    function getSignalMinute(timeStr) {
        if (!timeStr) return -1;
        let clean = String(timeStr).replace(/^Ex:\s*/i, '').replace('h', ':').replace('H', ':').trim();
        const parts = clean.split(':');
        if (parts.length >= 2) return parseInt(parts[1], 10);
        return parseInt(parts[0], 10);
    }

    // Vérifie si le signal actuel est passé au niveau temps
    function hasCurrentSignalPassed(sig) {
        if (!sig) return true;
        const sigMin = getSignalMinute(sig.time);
        if (isNaN(sigMin) || sigMin < 0) return true;

        const currentMin = new Date().getMinutes();
        return currentMin >= sigMin;
    }

    function updateSignalDisplay() {
        if (!activeSignals || activeSignals.length === 0) {
            document.getElementById('signal-time').innerText = "Information";
            document.getElementById('signal-odd').innerText = "FINI";
            document.getElementById('signal-odd').style.color = "#e74c3c";
            document.getElementById('signal-safe').innerText = "Aucun signal actif disponible";
            document.getElementById('next-btn').disabled = true;
            return;
        }

        if (currentIndex >= activeSignals.length) {
            document.getElementById('signal-time').innerText = "Session terminée";
            document.getElementById('signal-odd').innerText = "FINI";
            document.getElementById('signal-odd').style.color = "#2ecc71";
            document.getElementById('signal-safe').innerText = "Rendez-vous à la prochaine session !";
            document.getElementById('next-btn').disabled = true;
            return;
        }

        // Le signal à l'index courant S'AFFICHE TOUJOURS
        const currentSig = activeSignals[currentIndex];
        const displayTime = String(currentSig.time).replace(/^Ex:\s*/i, '');

        document.getElementById('signal-time').innerText = "Heure du signal : " + displayTime;
        
        let multiplierText = String(currentSig.multiplier).replace(/^Ex:\s*/i, '');
        if (!multiplierText.includes('x')) multiplierText = 'x' + multiplierText;
        document.getElementById('signal-odd').innerText = multiplierText;
        document.getElementById('signal-odd').style.color = "#2ecc71";
        
        let safeText = String(currentSig.safety || "1.50").replace(/^Ex:\s*/i, '');
        if (!safeText.includes('x')) safeText = 'x' + safeText;
        document.getElementById('signal-safe').innerText = "Auto-retrait recommandé : " + safeText;

        updateButtonStatus();
    }

    function updateButtonStatus() {
        const nextBtn = document.getElementById('next-btn');
        if (currentIndex >= activeSignals.length) {
            nextBtn.disabled = true;
            return;
        }

        const currentSig = activeSignals[currentIndex];
        // Bloque le bouton tant que la minute du signal courant n'est pas atteinte
        const canGoNext = hasCurrentSignalPassed(currentSig);
        nextBtn.disabled = !canGoNext;
    }

    function nextSignal() {
        const currentSig = activeSignals[currentIndex];
        if (hasCurrentSignalPassed(currentSig)) {
            currentIndex++;
            updateSignalDisplay();
        }
    }

    function logout() {
        if (autoCheckTimer) clearInterval(autoCheckTimer);
        localStorage.removeItem('luckyjet_vip_id');
        document.getElementById('signal-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('user-id').value = '';
    }

    function showMsg(text, type) {
        const msgBox = document.getElementById('login-msg');
        msgBox.className = "alert " + (type === "error" ? "alert-error" : "alert-success");
        msgBox.innerText = text;
        msgBox.classList.remove('hidden');
    }
</script>

</body>
</html>
